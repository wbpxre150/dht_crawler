# DHT Crawler Configuration File
# Architecture: thread trees bootstrap solely from the BEP51 cache.
# On cold start, the supervisor runs a parallel URL bootstrap to
# populate the cache; on warm restart trees sample from it directly.
# Lines starting with # are comments.
# ==== DHT Settings ====
dht_port=6881

# ==== Database & Logging ====
db_path=data/torrents.db
log_level=INFO

# ==== Bloom Filter Settings ====
bloom_enabled=1
bloom_capacity=30000000
failure_bloom_capacity=30000000
bloom_error_rate=0.001
bloom_persist=1
bloom_path=data/bloom.dat

# ==== Batched Writes ====
batch_size=500
flush_interval=300

# ==== Daily Backup ====
backup_enabled=1
backup_path=/home/adam/external_hdd/dht_crawler_backup/torrent.db.bak

# SSH incremental backup: streams daily new rows as compressed SQL to a remote server.
# Files named incremental_YYYYMMDD_START-END.sql.zst. Runs in background thread.
# Requires: zstd and sqlite3 on PATH, passwordless SSH key auth, host in known_hosts.
ssh_backup_enabled=0
ssh_host=188.166.19.141
ssh_user=unjumble
ssh_dest_path=/home/unjumble/dht_crawler_backup/
ssh_key_path=""
ssh_bookmark_path=data/ssh_backup_ids.txt

# rclone incremental backup: streams daily new rows as compressed SQL via rclone rcat.
# Files named incremental_YYYYMMDD_START-END.sql.zst. Runs in background thread.
# Requires: zstd, sqlite3, and rclone on PATH with a configured remote.
rclone_backup_enabled=1
rclone_remote=r2
rclone_dest_path=dht-backup/dht_crawler_backup
rclone_bookmark_path=data/rclone_backup_ids.txt

# ==== Pornography Content Filter ====
porn_filter_enabled=1
porn_filter_keyword_file=porn_filter_keywords.txt

# ==== Language Filter ====
# Filter torrents where non-Latin characters exceed this percentage
# of the total characters in the name and file list. (0=disabled, default: 33)
language_filter_non_latin_threshold=33

# ==== Supervisor-Level Bootstrap (cold start) ====
# When the BEP51 cache is empty (fresh data dir), the supervisor runs a
# parallel URL bootstrap to collect ~1000 DHT nodes, then submits them
# to the BEP51 cache. On every subsequent restart the cache is warm
# and this step is skipped. Tuned for ~30-60s on a cold start.
global_bootstrap_target = 1000
global_bootstrap_timeout_sec = 60
global_bootstrap_workers = 20

# ==== Thread Tree Architecture ====
num_trees = 32
use_keyspace_partitioning=1
dead_partition_threshold = 3
max_trees_per_partition = 4

# ==== Per-Tree Worker Counts (multiplied by num_trees) ====
# find_node workers per tree
tree_find_node_workers = 3
# BEP51 sample_infohashes workers per tree
tree_bep51_workers = 10
# get_peers workers per tree
tree_get_peers_workers = 50
# Metadata workers per tree
tree_metadata_workers = 75
# Infohash queue capacity per tree
tree_infohash_queue_capacity = 3000
# BEP51 query interval in milliseconds
tree_bep51_query_interval_ms = 5
# BEP51 per-node query cooldown in seconds
bep51_node_cooldown_sec = 3
# Peers queue capacity per tree
tree_peers_queue_capacity = 3000
# get_peers timeout per tree in milliseconds
tree_get_peers_timeout_ms = 3000
# Peers to attempt in parallel per infohash
tree_parallel_peers = 4
# TCP connection establishment timeout in milliseconds
tree_tcp_connect_timeout_ms = 2000

# ==== Throttling Thresholds ====
# Find_node workers pause when infohash queue reaches this size
tree_infohash_pause_threshold = 2500
# Resume when queue falls below
tree_infohash_resume_threshold = 1000
# Get_peers workers pause when peers queue reaches this size
tree_peers_pause_threshold = 2500
# Resume when peers queue falls below
tree_peers_resume_threshold = 1000

# ==== Rate-Based Respawn ====
min_metadata_rate = 0.005
dynamic_rate_margin = 0.01
tree_rate_check_interval_sec = 120
tree_rate_grace_period_sec = 30
tree_rate_ema_alpha = 0.3
tree_min_lifetime_minutes = 8
tree_require_empty_queue = 0

# ==== Respawn Overlapping Settings ====
respawn_spawn_threshold = 20
respawn_drain_timeout_sec = 180
max_draining_trees = 16

# ==== BEP51 Cache Settings ====
bep51_cache_path = data/bep51_cache.dat
bep51_cache_capacity = 50000
bep51_cache_submit_percent = 17

# ==== Refresh Thread Settings (for /refresh HTTP endpoint) ====
refresh_bootstrap_sample_size = 1000
refresh_routing_table_target = 500
refresh_ping_workers = 1
refresh_find_node_workers = 1
refresh_get_peers_workers = 1
refresh_request_queue_capacity = 100
refresh_get_peers_timeout_ms = 500
refresh_max_iterations = 3
